[package]
name = "mf_local_history"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
mf_text_encoding = { path = "../text_encoding" }

[dev-dependencies]
tempfile = "3"
