name: Test CI

on:
  push:
    branches: ['**']
  workflow_call:
    secrets:
      CAPRICORN_READ_TOKEN:
        required: true

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install rust target
        run: rustup target add x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install verified Capricorn runtime
        run: yarn install:capricorn-runtime
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CAPRICORN_READ_TOKEN || secrets.ACCESS_TOKEN }}

      - name: Build workspaces
        run: yarn build

      - name: Check application types
        run: |
          yarn workspace @markflowy/desktop build:types
          yarn workspace @markflowy/desktop test:e2e:types
          yarn workspace @markflowy/web build:types

      - name: Run Test
        run: yarn test

      - name: Verify the pinned published runtime
        run: yarn workspace @markflowy/desktop test:capricorn-published

      - name: Test Rust workspaces
        run: cargo test --workspace --lib --tests --locked

      - name: Check release and dependency contracts
        run: |
          yarn test:release-workflows
          yarn test:security-dependencies
          yarn test:dev-desktop
          yarn workspace @markflowy/desktop test:e2e:runner
          yarn translate:check

      - name: Verify generated public documents
        run: yarn workspace @markflowy/web test:content

      - name: Build isolated native E2E app
        run: yarn workspace @markflowy/desktop tauri:build:e2e

      - name: Run native desktop E2E
        timeout-minutes: 20
        run: yarn workspace @markflowy/desktop test:e2e

      - name: Upload native E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/desktop/e2e/reports/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn
